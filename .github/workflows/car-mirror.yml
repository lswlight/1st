name: CarMirror APK

on:
  push:
    paths:
      - 'car-mirror/**'
      - '.github/workflows/car-mirror.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build APK
        working-directory: car-mirror
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp car-mirror/app/build/outputs/apk/release/app-release.apk out/CarMirror.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CarMirror-apk
          path: out/CarMirror.apk

      # 휴대폰에서 바로 받을 수 있도록 고정 릴리스(carmirror-latest)에 APK 를 올린다.
      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: carmirror-latest
          name: CarMirror (최신 빌드)
          prerelease: true
          files: out/CarMirror.apk
          body: |
            휴대폰에서 CarMirror.apk 를 눌러 받으세요.
            빌드 커밋: ${{ github.sha }}
