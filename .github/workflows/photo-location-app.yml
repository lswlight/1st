name: 사진 위치 분류 앱 빌드

on:
  push:
    paths:
      - "photo-location-app/**"
      - ".github/workflows/photo-location-app.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: photo-location-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: APK 빌드
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: photo-location-apk
          path: photo-location-app/app/build/outputs/apk/debug/app-debug.apk
