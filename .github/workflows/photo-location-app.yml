name: 앨범 박스 앱 빌드

on:
  push:
    paths:
      - "photo-location-app/**"
      - ".github/workflows/photo-location-app.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: photo-location-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: APK 빌드
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: photo-location-apk
          path: photo-location-app/app/build/outputs/apk/debug/app-debug.apk
      # 휴대폰 브라우저에서 바로 받을 수 있도록 고정 주소의 릴리스에 apk 를 올린다.
      # https://github.com/lswlight/1st/releases/download/photo-app-latest/photo-location.apk
      - name: 릴리스용 파일 이름 정리
        run: cp app/build/outputs/apk/debug/app-debug.apk photo-location.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: photo-app-latest
          name: 앨범 박스 (최신)
          target_commitish: ${{ github.sha }}
          body: |
            휴대폰에서 아래 photo-location.apk 를 눌러 받은 뒤 설치하세요.
            빌드 커밋: ${{ github.sha }}
          files: photo-location-app/photo-location.apk
